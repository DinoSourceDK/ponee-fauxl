  /api/stream.json:
    get:
      parameters:
      - name: list
        in: query
        description: The list part of the mailing list(s) to search. Can be * for wildcard search. Required unless lists is given
        required: false
        schema:
          type: string
          example: dev
      - name: domain
        in: query
        description: The domain part of the mailing list(s) to search. Can be * for wildcard search. Required unless lists is given
        required: false
        schema:
          type: string
          example: example.org
      - name: lists
        in: query
        description: Comma-separated List-IDs to collate results across, replacing the list/domain pair. Accepts <dev.example.org>, dev.example.org and dev@example.org forms (up to 64)
        required: false
        schema:
          type: string
          example: "<dev.example.org>,<users.example.org>"
      - name: mode
        in: query
        description: "Listing mode: one row per discussion thread, or one row per email"
        required: false
        schema:
          type: string
          enum: [threads, emails]
          default: threads
      - name: sort
        in: query
        description: Row order (threads mode only). Newest activity, most upvotes or most replies first; ties break on newest activity. upvotes implies social=yes
        required: false
        schema:
          type: string
          enum: [activity, upvotes, replies]
          default: activity
      - name: page
        in: query
        description: Zero-based page number
        required: false
        schema:
          type: integer
          default: 0
      - name: quant
        in: query
        description: Rows per page (clamped to 1-100)
        required: false
        schema:
          type: integer
          default: 25
      - name: d
        in: query
        description: Optional date specification (YYYY-M month, lte=1M style relative spans, or dfr=Y-M-D|dto=Y-M-D ranges)
        required: false
        schema:
          type: string
          example: 2025-9
      - name: q
        in: query
        description: Optional free-text query (words are ANDed, +required, -excluded, "phrases")
        required: false
        schema:
          type: string
      - name: header_from
        in: query
        description: Optional phrase match on the from header
        required: false
        schema:
          type: string
      - name: header_subject
        in: query
        description: Optional phrase match on the subject header
        required: false
        schema:
          type: string
      - name: header_to
        in: query
        description: Optional phrase match on the to header
        required: false
        schema:
          type: string
      - name: header_body
        in: query
        description: Optional phrase match on the body
        required: false
        schema:
          type: string
      - name: header_messageid
        in: query
        description: Optional phrase match on the message-id header
        required: false
        schema:
          type: string
      - name: social
        in: query
        description: Set to "yes" to include per-thread upvote sums where the backend supports social data
        required: false
        schema:
          type: string
          enum: [yes]
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamResponse'
          description: One page of listing rows plus search-wide statistics
        '400':
          content:
            text/plain:
              example: "You must specify both a list and a domain parameter"
          description: Missing or invalid parameters
      security:
      - cookieAuth: []
      summary: Paged, transfer-optimized archive listing (the same results as stats.json, one page at a time; POST with the same parameters also works)
